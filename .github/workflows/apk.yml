name: Compilar APK

# Se lanza al subir cambios, o a mano desde la pestaña Actions del repositorio.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web
        run: npm run build

      - name: Pasar a Android
        run: npx cap sync android

      # La firma va en secretos del repositorio, nunca en el código.
      # Sin ella el APK no se puede instalar ni actualizar.
      - name: Recuperar la firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto KEYSTORE_BASE64. Mira CLAVES-NO-SUBIR.txt."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tu-treno.keystore"

      - name: Compilar el APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/tu-treno.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Renombrar con la versión
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "TuTreno-$VERSION.apk"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          ls -lh "TuTreno-$VERSION.apk"

      # Queda descargable en la propia ejecución, en "Artifacts".
      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: TuTreno-${{ steps.apk.outputs.version }}
          path: TuTreno-*.apk
          retention-days: 90

      # Y además como versión descargable con enlace fijo, que es de donde la
      # app lee si hay actualización.
      - name: Crear la versión
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.apk.outputs.version }}
          name: Tu Treno ${{ steps.apk.outputs.version }}
          body: |
            Instálala desde el archivo `.apk` de abajo.

            La primera vez Android pedirá permiso para instalar apps de origen
            desconocido: es normal al instalar fuera de la Play Store.
          files: TuTreno-*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
