<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu Treno — maqueta</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  img{display:block;max-width:100%}
  input{font:inherit}
  ul,ol{list-style:none}

  :root{
    --azul-marca:#4AA2EF; --azul-marca-2:#3F8BE8;
    --azul:#1263C4; --azul-activo:#1A6FD4;
    --texto:#18202B; --texto-2:#5A6572; --texto-3:#8A94A0;
    --fondo:#F4F6F8; --superficie:#FFFFFF; --borde:#E3E8EE;
    --r:14px; --tap:56px;
  }
  html,body{height:100%}
  body{
    background:#DDE3EA;color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
  }

  /* Marco de móvil sólo en pantalla ancha; en el móvil ocupa todo */
  .marco{
    width:100%;max-width:412px;height:100vh;max-height:900px;
    background:var(--fondo);position:relative;overflow:hidden;
    display:flex;flex-direction:column;
  }
  @media(min-width:520px) and (min-height:700px){
    .marco{border-radius:32px;box-shadow:0 24px 60px rgba(20,30,45,.28);height:860px}
  }

  /* ── Cabecera ── */
  .cab{
    background:var(--superficie);border-bottom:1px solid var(--borde);
    padding:14px 16px 12px;display:flex;align-items:center;gap:10px;flex-shrink:0;
  }
  .cab .logo{height:26px;width:auto}
  .cab .titulo{font-size:17px;font-weight:700;letter-spacing:-.2px}
  .cab .atras{
    width:40px;height:40px;margin-left:-8px;display:grid;place-items:center;
    font-size:24px;color:var(--azul);flex-shrink:0;
  }

  /* ── Cuerpo desplazable ── */
  .cuerpo{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .pad{padding:16px}
  .rotulo{
    font-size:12px;font-weight:700;letter-spacing:.9px;text-transform:uppercase;
    color:var(--texto-3);margin:4px 0 10px;
  }

  /* ── Presets ── */
  .presets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
  .preset{
    background:var(--superficie);border:1px solid var(--borde);border-radius:var(--r);
    padding:14px;text-align:left;min-height:var(--tap);
  }
  .preset:active{background:#EDF3FB}
  .preset .n{font-size:17px;font-weight:700;display:block}
  .preset .s{font-size:14px;color:var(--texto-2);display:block;margin-top:2px}
  .preset.ancho{grid-column:1/-1}

  /* ── Chips de músculo ── */
  .chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chip{
    min-height:var(--tap);border-radius:var(--r);border:1.5px solid var(--borde);
    background:var(--superficie);font-size:16px;font-weight:600;
    display:flex;align-items:center;justify-content:space-between;padding:0 14px;
    transition:background .12s,color .12s;
  }
  /* Seleccionado = relleno sólido, no borde: un borde no se ve a medio metro */
  .chip[aria-pressed="true"]{background:var(--azul);color:#fff;border-color:var(--azul)}
  .chip .tick{font-size:18px;opacity:0;flex-shrink:0}
  .chip[aria-pressed="true"] .tick{opacity:1}
  .chip:disabled{opacity:.38}
  .aviso{
    font-size:14px;color:var(--texto-2);background:#FFF6E5;border:1px solid #F5DFB0;
    border-radius:10px;padding:10px 12px;margin-top:12px;
  }

  /* ── Barra inferior de acción ── */
  .barra{
    flex-shrink:0;background:var(--superficie);border-top:1px solid var(--borde);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  }
  .reparto{font-size:14px;color:var(--texto-2);text-align:center;margin-bottom:8px;min-height:20px}
  .cta{
    width:100%;min-height:var(--tap);border-radius:var(--r);background:var(--azul);
    color:#fff;font-size:17px;font-weight:700;
  }
  .cta:disabled{background:#C6CFD9;color:#8A94A0}
  .cta.sec{background:transparent;color:var(--azul);border:1.5px solid var(--azul)}

  /* ── Pestañas ── */
  .tabs{
    flex-shrink:0;display:grid;grid-template-columns:1fr 1fr;
    background:var(--superficie);border-top:1px solid var(--borde);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tab{
    min-height:var(--tap);display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--texto-3);
  }
  .tab .ic{font-size:20px;line-height:1}
  .tab[aria-selected="true"]{color:var(--azul)}

  /* ── Lista de sesión ── */
  .cabsesion{padding:14px 16px 10px;background:var(--superficie);border-bottom:1px solid var(--borde)}
  .cabsesion h2{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .ajuste{
    margin-top:6px;font-size:14px;color:var(--azul);font-weight:600;
    display:inline-flex;align-items:center;gap:6px;
  }
  .item{
    display:flex;gap:12px;align-items:center;background:var(--superficie);
    border:1px solid var(--borde);border-radius:var(--r);padding:10px;margin-bottom:10px;
    min-height:var(--tap);text-align:left;width:100%;
  }
  .item .num{
    width:26px;height:26px;border-radius:50%;background:var(--fondo);color:var(--texto-2);
    font-size:13px;font-weight:700;display:grid;place-items:center;flex-shrink:0;
  }
  .item img{width:56px;height:56px;border-radius:10px;background:var(--fondo);object-fit:cover;flex-shrink:0}
  .item .txt{flex:1;min-width:0}
  .item .nom{font-size:16px;font-weight:700;line-height:1.25}
  .item .en{font-size:12px;color:var(--texto-3);margin-top:1px}
  .item .pres{font-size:14px;color:var(--azul);font-weight:700;margin-top:3px}

  /* ── Ficha ── */
  .gifcaja{
    background:var(--superficie);border-bottom:1px solid var(--borde);
    display:grid;place-items:center;padding:16px;
  }
  /* 260px, no media pantalla: el GIF original es de 180x180 y ampliado se ve sucio */
  .gifcaja img{width:260px;height:260px;object-fit:contain;image-rendering:auto}
  .fichanom{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
  .fichaen{font-size:13px;color:var(--texto-3);margin-top:2px}
  .prescaja{
    display:flex;align-items:baseline;gap:10px;margin:14px 0;
    background:#EDF3FB;border-radius:var(--r);padding:14px;
  }
  .prescaja .gr{font-size:26px;font-weight:800;color:var(--azul);letter-spacing:-.5px}
  .prescaja .lb{font-size:14px;color:var(--texto-2)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .etq{
    font-size:13px;background:var(--superficie);border:1px solid var(--borde);
    border-radius:999px;padding:5px 11px;color:var(--texto-2);
  }
  .etq b{color:var(--texto);font-weight:700}
  .bloque{background:var(--superficie);border:1px solid var(--borde);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
  .bloque > summary{
    min-height:var(--tap);display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;font-size:16px;font-weight:700;list-style:none;
  }
  .bloque > summary::-webkit-details-marker{display:none}
  .bloque > summary::after{content:'▾';color:var(--texto-3);font-size:14px}
  .bloque[open] > summary::after{content:'▴'}
  .bloque .in{padding:0 14px 14px}
  .lista li{position:relative;padding-left:18px;margin-bottom:9px;font-size:15px;line-height:1.45}
  .lista li::before{content:'';position:absolute;left:2px;top:9px;width:6px;height:6px;border-radius:50%;background:var(--azul)}
  .lista.mal li::before{background:#D8563F}
  .pasos li{counter-increment:p;position:relative;padding-left:26px;margin-bottom:10px;font-size:15px}
  .pasos li::before{
    content:counter(p);position:absolute;left:0;top:1px;width:19px;height:19px;border-radius:50%;
    background:var(--fondo);color:var(--texto-2);font-size:11px;font-weight:700;display:grid;place-items:center;
  }
  .pasos{counter-reset:p}

  /* ── Descanso ── */
  .descanso{
    position:absolute;inset:0;background:var(--superficie);z-index:40;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;
  }
  .descanso .rot{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--texto-3);font-weight:700}
  .reloj{font-size:104px;font-weight:800;letter-spacing:-4px;color:var(--texto);
    font-variant-numeric:tabular-nums;line-height:1;margin:10px 0 6px}
  .descanso .sig{font-size:16px;color:var(--texto-2);text-align:center;margin-bottom:34px}
  .descanso .sig b{color:var(--texto)}
  .botones{display:flex;gap:12px;width:100%;max-width:320px}
  .btn96{
    flex:1;min-height:96px;border-radius:18px;font-size:18px;font-weight:700;
    background:var(--fondo);color:var(--texto);border:1.5px solid var(--borde);
  }
  .btn96.pri{background:var(--azul);color:#fff;border-color:var(--azul)}

  /* ── Explorar ── */
  .buscador{
    display:flex;align-items:center;gap:8px;background:var(--superficie);
    border:1.5px solid var(--borde);border-radius:var(--r);padding:0 12px;min-height:var(--tap);
  }
  .buscador input{flex:1;border:none;outline:none;background:none;font-size:16px;min-height:var(--tap)}
  .filtros{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
  .filtros::-webkit-scrollbar{display:none}
  .fchip{
    flex-shrink:0;border:1.5px solid var(--borde);background:var(--superficie);
    border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600;white-space:nowrap;
  }
  .fchip[aria-pressed="true"]{background:var(--azul);color:#fff;border-color:var(--azul)}
  .grupo > summary{
    min-height:48px;display:flex;align-items:center;justify-content:space-between;
    font-weight:700;font-size:15px;list-style:none;padding:0 2px;
  }
  .grupo > summary::-webkit-details-marker{display:none}
  .grupo > summary .cont{font-size:13px;color:var(--texto-3);font-weight:600}
  .vacio{text-align:center;color:var(--texto-3);padding:40px 20px;font-size:15px}

  .oculto{display:none !important}
  .nota{
    font-size:12px;color:var(--texto-3);text-align:center;padding:10px 16px 2px;
  }
</style>
</head>
<body>
<div class="marco">

  <!-- CABECERA -->
  <header class="cab">
    <button class="atras oculto" id="atras">‹</button>
    <img class="logo" id="logo" src="../logo.webp" alt="PercyTech">
    <span class="titulo" id="titulo">Tu Treno</span>
  </header>

  <!-- CUERPO -->
  <main class="cuerpo" id="cuerpo"></main>

  <!-- BARRA DE ACCIÓN -->
  <div class="barra oculto" id="barra">
    <div class="reparto" id="reparto"></div>
    <button class="cta" id="cta" disabled>Elige qué entrenas</button>
  </div>

  <!-- PESTAÑAS -->
  <nav class="tabs" id="tabs">
    <button class="tab" data-tab="entrenar" aria-selected="true"><span class="ic">🏋️</span>Entrenar</button>
    <button class="tab" data-tab="explorar" aria-selected="false"><span class="ic">🔍</span>Explorar</button>
  </nav>

  <!-- DESCANSO -->
  <div class="descanso oculto" id="descanso">
    <div class="rot">Descanso</div>
    <div class="reloj" id="reloj">2:00</div>
    <div class="sig" id="sig"></div>
    <div class="botones">
      <button class="btn96" id="mas30">+30 s</button>
      <button class="btn96 pri" id="saltar">Saltar</button>
    </div>
  </div>

</div>

<script>
/*__LOGICA__*/
</script>
<script>
const DATOS = /*__DATOS__*/;
</script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const cuerpo=$('cuerpo'), barra=$('barra'), cta=$('cta'), reparto=$('reparto'),
        tabs=$('tabs'), atras=$('atras'), titulo=$('titulo'), logo=$('logo'),
        descanso=$('descanso'), reloj=$('reloj'), sig=$('sig');

  const MEDIA = '../../exercises-dataset/';
  const ejercicios = DATOS.ejercicios;
  const porId = Object.fromEntries(ejercicios.map(e=>[e.id,e]));

  const estado = {
    tab:'entrenar', vista:'inicio',
    sel:[], sesion:null, actual:0,
    nivel:2, objetivo:'hipertrofia',
    busqueda:'', filtroEquipo:null,
  };

  const NIVELES={1:'Principiante',2:'Peso libre',3:'Avanzado'};

  // ── Render ──────────────────────────────────────────────
  function render(){
    atras.classList.toggle('oculto', estado.vista==='inicio');
    logo.classList.toggle('oculto', estado.vista!=='inicio');
    titulo.textContent = estado.vista==='inicio' ? 'Tu Treno'
      : estado.vista==='sesion' ? 'Tu sesión'
      : estado.vista==='ficha' ? 'Ejercicio' : 'Tu Treno';

    if(estado.tab==='explorar'){ vistaExplorar(); return; }
    if(estado.vista==='inicio')  vistaInicio();
    if(estado.vista==='sesion')  vistaSesion();
    if(estado.vista==='ficha')   vistaFicha();
  }

  // ── Entrenar: inicio ────────────────────────────────────
  function vistaInicio(){
    const gs = Object.entries(GRUPOS);
    cuerpo.innerHTML = '<div class="pad">'
      + '<div class="rotulo">Días listos</div><div class="presets">'
      + PRESETS.map((p,i)=>`<button class="preset ${i===PRESETS.length-1?'ancho':''}" data-preset="${p.id}">
           <span class="n">${p.nombre}</span>
           <span class="s">${p.grupos.map(g=>GRUPOS[g].nombre).join(' · ')}</span></button>`).join('')
      + '</div>'
      + '<div class="rotulo">O elige tus músculos</div><div class="chips">'
      + gs.map(([id,g])=>{
          const on = estado.sel.includes(id);
          const tope = !on && estado.sel.length>=MAX_GRUPOS;
          return `<button class="chip" data-grupo="${id}" aria-pressed="${on}" ${tope?'disabled':''}>
                    <span>${g.nombre}</span><span class="tick">✓</span></button>`;
        }).join('')
      + '</div>'
      + (estado.sel.length>=MAX_GRUPOS
          ? `<div class="aviso">Máximo ${MAX_GRUPOS} grupos por sesión. Para más, usa <b>Torso</b> o <b>Cuerpo completo</b>.</div>` : '')
      + '<div class="nota">El primer músculo que tocas es el principal y se lleva más volumen.</div>'
      + '</div>';

    barra.classList.remove('oculto');
    reparto.textContent = estado.sel.length ? repartoTexto(estado.sel, estado.objetivo) : '';
    cta.disabled = !estado.sel.length;
    cta.textContent = estado.sel.length
      ? 'Generar · ' + estado.sel.map(g=>GRUPOS[g].nombre).join(' + ')
      : 'Elige qué entrenas';
  }

  // ── Entrenar: sesión ────────────────────────────────────
  function vistaSesion(){
    const s = estado.sesion;
    cuerpo.innerHTML =
      `<div class="cabsesion">
         <h2>${s.grupos.map(g=>GRUPOS[g].nombre).join(' + ')}</h2>
         <button class="ajuste" data-accion="nivel">Nivel ${estado.nivel} · ${NIVELES[estado.nivel]} — cambiar</button>
       </div>
       <div class="pad">`
      + s.lista.map((e,i)=>{
          const p = prescribir(estado.objetivo, e.compuesto);
          return `<button class="item" data-ficha="${i}">
            <span class="num">${i+1}</span>
            <img src="${MEDIA+e.img}" alt="" loading="lazy">
            <span class="txt">
              <span class="nom">${e.nombre}</span>
              <span class="en">${e.en}</span>
              <span class="pres">${p.series} × ${p.reps} · ${formatoDescanso(p.descanso)}</span>
            </span></button>`;
        }).join('')
      + `<div class="nota">Objetivo: ${OBJETIVOS[estado.objetivo].nombre}. Toca un ejercicio para ver la técnica y arrancar el descanso.</div></div>`;

    barra.classList.remove('oculto');
    reparto.textContent = s.lista.length + ' ejercicios · ' + repartoTexto(s.grupos, estado.objetivo);
    cta.disabled = false;
    cta.className = 'cta sec';
    cta.textContent = 'Otra sesión';
  }

  // ── Ficha ───────────────────────────────────────────────
  function vistaFicha(){
    const e = estado.sesion.lista[estado.actual];
    const p = prescribir(estado.objetivo, e.compuesto);
    const c = CONTENIDO[e.patron] || {tecnica:[],errores:[]};
    const alt = alternativas(ejercicios, e, 3);

    cuerpo.innerHTML =
      `<div class="gifcaja"><img src="${MEDIA+e.gif}" alt="${e.nombre}"></div>
       <div class="pad">
         <div class="fichanom">${e.nombre}</div>
         <div class="fichaen">${e.en}</div>
         <div class="prescaja">
           <span class="gr">${p.series} × ${p.reps}</span>
           <span class="lb">descanso ${formatoDescanso(p.descanso)}</span>
         </div>
         <div class="meta">
           <span class="etq">Trabaja <b>${e.musculo}</b></span>
           ${e.secundarios.length?`<span class="etq">También ${e.secundarios.join(', ')}</span>`:''}
           <span class="etq">${e.equipoEs||'peso corporal'}</span>
           <span class="etq">Nivel <b>${e.nivel}</b></span>
         </div>

         <details class="bloque" open>
           <summary>Técnica y errores</summary>
           <div class="in">
             <ul class="lista">${c.tecnica.map(t=>`<li>${t}</li>`).join('')}</ul>
             ${c.errores.length?`<div class="rotulo" style="margin-top:14px">Errores comunes</div>
               <ul class="lista mal">${c.errores.map(t=>`<li>${t}</li>`).join('')}</ul>`:''}
           </div>
         </details>

         <details class="bloque">
           <summary>Paso a paso</summary>
           <div class="in"><ol class="pasos">${e.pasos.map(t=>`<li>${t}</li>`).join('')}</ol></div>
         </details>

         <details class="bloque">
           <summary>Cambiar por otro</summary>
           <div class="in">
             ${alt.length? alt.map(a=>`<button class="item" data-cambiar="${a.id}">
                 <img src="${MEDIA+a.img}" alt="" loading="lazy">
                 <span class="txt"><span class="nom">${a.nombre}</span>
                 <span class="en">${a.equipoEs||'peso corporal'} · nivel ${a.nivel}</span></span></button>`).join('')
               : '<div class="vacio">No hay alternativas para este movimiento.</div>'}
           </div>
         </details>
         <div class="nota">Las alternativas ignoran tu nivel a propósito: son la vía natural para progresar.</div>
       </div>`;

    barra.classList.remove('oculto');
    reparto.textContent = 'Ejercicio ' + (estado.actual+1) + ' de ' + estado.sesion.lista.length;
    cta.className='cta'; cta.disabled=false;
    cta.textContent = 'Empezar descanso · ' + formatoDescanso(p.descanso);
  }

  // ── Explorar ────────────────────────────────────────────
  const EQUIPOS_FILTRO=[['dumbbell','Mancuerna'],['barbell','Barra'],['cable','Polea'],
                        ['leverage machine','Máquina'],['body weight','Peso corporal']];
  function vistaExplorar(){
    const q = estado.busqueda.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
    let lista = ejercicios;
    if(q) lista = lista.filter(e=>e.alias.some(a=>a.includes(q)));
    if(estado.filtroEquipo) lista = lista.filter(e=>e.equipo===estado.filtroEquipo);

    const porPatron={};
    lista.forEach(e=>{ (porPatron[e.patron]=porPatron[e.patron]||[]).push(e); });
    const grupos = Object.entries(porPatron).sort((a,b)=>b[1].length-a[1].length);

    cuerpo.innerHTML = '<div class="pad">'
      + `<div class="buscador"><span>🔍</span>
           <input id="q" placeholder="press banca, dominadas…" value="${estado.busqueda}"></div>`
      + '<div class="filtros">'
      + EQUIPOS_FILTRO.map(([k,n])=>`<button class="fchip" data-eq="${k}" aria-pressed="${estado.filtroEquipo===k}">${n}</button>`).join('')
      + '</div>'
      + (lista.length? grupos.map(([pid,exs])=>
          `<details class="grupo"><summary>
             <span>${(DATOS.patrones[pid]||{}).nombre||'Otros'}</span>
             <span class="cont">${exs.length}</span></summary>
           <div>${exs.slice(0,25).map(e=>`<button class="item" data-explorar="${e.id}">
             <img src="${MEDIA+e.img}" alt="" loading="lazy">
             <span class="txt"><span class="nom">${e.nombre}</span>
             <span class="en">${e.equipoEs||'peso corporal'} · nivel ${e.nivel}</span></span></button>`).join('')}
             ${exs.length>25?`<div class="nota">y ${exs.length-25} más</div>`:''}</div></details>`).join('')
        : '<div class="vacio">Nada con ese nombre.<br>Prueba con “press”, “curl” o “sentadilla”.</div>')
      + `<div class="nota">${lista.length} ejercicios</div></div>`;

    barra.classList.add('oculto');
    const inp=$('q');
    if(inp){ inp.addEventListener('input',ev=>{ estado.busqueda=ev.target.value; const pos=ev.target.selectionStart;
      vistaExplorar(); const n=$('q'); n.focus(); n.setSelectionRange(pos,pos); }); }
  }

  // ── Descanso ────────────────────────────────────────────
  let finDescanso=null, tic=null;
  function abrirDescanso(seg){
    // Se guarda la marca de fin, no un contador: así sobrevive a que se apague
    // la pantalla o el sistema congele la app.
    finDescanso = Date.now() + seg*1000;
    const e = estado.sesion.lista[estado.actual+1];
    sig.innerHTML = e ? 'Después: <b>'+e.nombre+'</b>' : 'Último ejercicio de la sesión';
    descanso.classList.remove('oculto');
    pintarReloj();
    tic = setInterval(pintarReloj, 250);
  }
  function pintarReloj(){
    const q = Math.max(0, Math.round((finDescanso-Date.now())/1000));
    reloj.textContent = Math.floor(q/60)+':'+String(q%60).padStart(2,'0');
    if(q<=0){
      cerrarDescanso();
      if(navigator.vibrate) navigator.vibrate([400,120,400]);
    }
  }
  function cerrarDescanso(){ clearInterval(tic); descanso.classList.add('oculto'); }
  $('mas30').onclick = ()=>{ finDescanso += 30000; pintarReloj(); };
  $('saltar').onclick = cerrarDescanso;

  // ── Eventos ─────────────────────────────────────────────
  document.addEventListener('click', ev=>{
    const t = ev.target.closest('[data-preset],[data-grupo],[data-ficha],[data-cambiar],[data-explorar],[data-eq],[data-accion],[data-tab]');
    if(!t) return;

    if(t.dataset.tab){ estado.tab=t.dataset.tab;
      [...tabs.children].forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===estado.tab));
      render(); return; }

    if(t.dataset.preset){
      const p = PRESETS.find(x=>x.id===t.dataset.preset);
      estado.sel = p.grupos.slice(0,MAX_GRUPOS); generar(); return;
    }
    if(t.dataset.grupo){
      const g=t.dataset.grupo, i=estado.sel.indexOf(g);
      if(i>=0) estado.sel.splice(i,1);
      else if(estado.sel.length<MAX_GRUPOS) estado.sel.push(g);
      render(); return;
    }
    if(t.dataset.ficha!==undefined){ estado.actual=+t.dataset.ficha; estado.vista='ficha'; cuerpo.scrollTop=0; render(); return; }
    if(t.dataset.cambiar){
      estado.sesion.lista[estado.actual] = porId[t.dataset.cambiar];
      cuerpo.scrollTop=0; render(); return;
    }
    if(t.dataset.explorar){
      const e=porId[t.dataset.explorar];
      if(!estado.sesion){ estado.sesion={grupos:[],lista:[e]}; estado.actual=0; }
      else { estado.sesion.lista.splice(estado.actual+1,0,e); estado.actual=estado.actual+1; }
      estado.tab='entrenar'; estado.vista='ficha';
      [...tabs.children].forEach(b=>b.setAttribute('aria-selected', b.dataset.tab==='entrenar'));
      cuerpo.scrollTop=0; render(); return;
    }
    if(t.dataset.eq){
      estado.filtroEquipo = estado.filtroEquipo===t.dataset.eq ? null : t.dataset.eq;
      vistaExplorar(); return;
    }
    if(t.dataset.accion==='nivel'){
      estado.nivel = estado.nivel===3 ? 1 : estado.nivel+1;
      generar(); return;
    }
  });

  function generar(){
    const lista = generarSesion(ejercicios, estado.sel, {nivel:estado.nivel, objetivo:estado.objetivo});
    estado.sesion = { grupos: estado.sel.slice(), lista };
    estado.vista='sesion'; cuerpo.scrollTop=0; render();
  }

  cta.addEventListener('click', ()=>{
    if(estado.vista==='inicio') return generar();
    if(estado.vista==='sesion') return generar();
    if(estado.vista==='ficha'){
      const e=estado.sesion.lista[estado.actual];
      abrirDescanso(prescribir(estado.objetivo, e.compuesto).descanso);
    }
  });

  atras.addEventListener('click', ()=>{
    if(estado.vista==='ficha'){ estado.vista='sesion'; }
    else if(estado.vista==='sesion'){ estado.vista='inicio'; cta.className='cta'; }
    cuerpo.scrollTop=0; render();
  });

  render();
})();
</script>
</body>
</html>
